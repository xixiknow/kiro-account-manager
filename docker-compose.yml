services:
  kam-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiro-account-manager:server
    container_name: kiro-account-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAM_HOST: 0.0.0.0
      KAM_PORT: 8765
      KAM_DATA_DIR: /data
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${KAM_PUBLISHED_PORT:-8765}:8765"
    volumes:
      - kam-data:/data

volumes:
  kam-data:
